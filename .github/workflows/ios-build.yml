name: iOS Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS Unit Tests (Simulator)
        working-directory: ios
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Using Simulator ID: $SIM_ID"
          xcodebuild test \
            -project OpenBridge.xcodeproj \
            -scheme OpenBridge \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Unsigned iOS Device App & Package IPA
        working-directory: ios
        run: |
          xcodebuild \
            -project OpenBridge.xcodeproj \
            -scheme OpenBridge \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/OpenBridge.app Payload/
          ls -la Payload/OpenBridge.app/
          test -f Payload/OpenBridge.app/Assets.car
          zip -qry OpenBridge-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenBridge-iOS-Unsigned-IPA
          path: ios/OpenBridge-unsigned.ipa
